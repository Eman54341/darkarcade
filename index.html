
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKARCADE</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090910;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 30px 15px;
  background: #11111d;
  border-bottom: 2px solid #8b35ee;
}

header h1 {
  margin: 0;
  font-size: 42px;
  letter-spacing: 6px;
  color: #bd7aff;
  text-shadow: 0 0 18px #8b35ee;
}

header p { color: #aaa; }

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px 18px;
}

.search {
  width: 100%;
  padding: 15px;
  background: #171724;
  color: white;
  border: 1px solid #7734bb;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 18px;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 25px;
}

.categories button {
  background: #171224;
  border: 1px solid #843cff;
  color: white;
  padding: 10px 17px;
  border-radius: 20px;
  cursor: pointer;
}

.categories button.active,
.categories button:hover {
  background: #843cff;
}

#gameCount {
  color: #aaa;
  margin-bottom: 15px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
}

.game {
  background: #151522;
  border: 1px solid #29293c;
  border-radius: 13px;
  padding: 17px;
  transition: .2s;
}

.game:hover {
  transform: translateY(-4px);
  border-color: #a34dff;
  box-shadow: 0 0 17px #842cff44;
}

.picture {
  height: 115px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  background: linear-gradient(135deg, #32144f, #101827);
  border-radius: 9px;
}

.game h2 {
  font-size: 19px;
  margin-bottom: 6px;
}

.game p {
  color: #aaa;
  font-size: 13px;
  min-height: 30px;
}

.play {
  width: 100%;
  padding: 12px;
  background: #8735e9;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.play:hover { background: #a75aff; }

footer {
  text-align: center;
  padding: 30px;
  color: #888;
}

footer a { color: #b77aff; }

/* FULL-SCREEN GAME PLAYER */

#player {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: black;
}

#player.hidden { display: none; }

#gameFrame {
  width: 100%;
  height: 100%;
  border: 0;
  background: black;
}

#closePlayer {
  position: absolute;
  z-index: 10000;
  top: 12px;
  right: 15px;
  padding: 12px 17px;
  border: 0;
  border-radius: 8px;
  background: #8735e9;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#closePlayer:hover { background: #a75aff; }
</style>
</head>

<body>

<header>
  <h1>DARKARCADE</h1>
  <p>30 GAMES. ONE ARCADE. INFINITE FUN.</p>
</header>

<main>

<input
  class="search"
  id="search"
  type="text"
  placeholder="Search for a game..."
>

<div class="categories">
  <button class="active" data-category="all">All Games</button>
  <button data-category="arcade">Arcade</button>
  <button data-category="puzzle">Puzzle</button>
  <button data-category="classic">Classic</button>
  <button data-category="brain">Brain Games</button>
  <button data-category="word">Word Games</button>
</div>

<div id="gameCount"></div>
<div class="games" id="games"></div>

</main>

<footer>
  <p>DARKARCADE — GAME TIME</p>
  <p>Games provided by
    <a href="https://playbolt.app/embed/" target="_blank">PlayBolt</a>
  </p>
</footer>

<div id="player" class="hidden">
  <button id="closePlayer" onclick="closeGame()">✕ EXIT GAME</button>
  <iframe
    id="gameFrame"
    title="DarkArcade Game Player"
    allow="autoplay; fullscreen; gamepad"
    allowfullscreen>
  </iframe>
</div>

<script>
const games = [
  {name:"2048", slug:"2048", icon:"🔢", category:"brain", desc:"Combine numbers to reach 2048."},
  {name:"Hextris", slug:"hextris", icon:"🔷", category:"arcade", desc:"Match colors in a hexagonal puzzle."},
  {name:"Astray", slug:"astray", icon:"🔮", category:"arcade", desc:"Navigate a rolling marble maze."},
  {name:"Tetris", slug:"tetris", icon:"🧱", category:"classic", desc:"Stack falling blocks."},
  {name:"Breakout", slug:"breakout", icon:"🎾", category:"classic", desc:"Break bricks with a bouncing ball."},
  {name:"Floppy Bird", slug:"floppy-bird", icon:"🐦", category:"arcade", desc:"Fly through gaps without hitting anything."},
  {name:"T-Rex Runner", slug:"t-rex-runner", icon:"🦖", category:"arcade", desc:"Jump over obstacles."},
  {name:"Tower Game", slug:"tower-game", icon:"🏗️", category:"arcade", desc:"Build the tallest tower you can."},
  {name:"Minesweeper", slug:"minesweeper", icon:"💡", category:"brain", desc:"Use clues to clear the grid."},
  {name:"Memory Match", slug:"memory-match", icon:"🃏", category:"brain", desc:"Find matching pairs of cards."},
  {name:"Sliding Puzzle", slug:"sliding-puzzle", icon:"🧩", category:"puzzle", desc:"Put the numbered tiles in order."},
  {name:"Snake", slug:"snake", icon:"🐍", category:"classic", desc:"Collect food and grow longer."},
  {name:"Whack-a-Mole", slug:"whack-a-mole", icon:"🔨", category:"arcade", desc:"Test your reaction speed."},
  {name:"Neon Pong", slug:"neon-pong", icon:"🏓", category:"classic", desc:"Play a neon version of Pong."},
  {name:"Piano Tiles", slug:"piano-tiles", icon:"🎹", category:"arcade", desc:"Tap the correct piano tiles."},
  {name:"Sky Hopper", slug:"sky-hopper", icon:"☁️", category:"arcade", desc:"Hop across floating platforms."},
  {name:"Lights Out", slug:"lights-out", icon:"💡", category:"puzzle", desc:"Turn off all the lights."},
  {name:"Sudoku", slug:"sudoku", icon:"🔢", category:"brain", desc:"Complete the number grid."},
  {name:"Nonogram", slug:"nonogram", icon:"🎨", category:"puzzle", desc:"Reveal pictures using number clues."},
  {name:"Sokoban", slug:"sokoban", icon:"📦", category:"puzzle", desc:"Push boxes into the right spots."},
  {name:"Connect Four", slug:"connect-four", icon:"🔴", category:"classic", desc:"Connect four pieces in a row."},
  {name:"Reversi", slug:"reversi", icon:"⚫", category:"classic", desc:"Flip pieces to control the board."},
  {name:"Hangman", slug:"hangman", icon:"🔤", category:"word", desc:"Guess the hidden word."},
  {name:"Simon Says", slug:"simon-says", icon:"🎨", category:"brain", desc:"Remember the color sequence."},
  {name:"Typing Test", slug:"typing-test", icon:"⌨️", category:"brain", desc:"Test your typing speed."},
  {name:"Word Search", slug:"word-search", icon:"🔎", category:"word", desc:"Find hidden words in the grid."},
  {name:"Word Guess", slug:"word-guess", icon:"💬", category:"word", desc:"Guess the secret word."},
  {name:"Anagrams", slug:"anagrams", icon:"🔠", category:"word", desc:"Rearrange letters to make words."},
  {name:"Missing Letter", slug:"missing-letter", icon:"✏️", category:"word", desc:"Find the missing letter."},
  {name:"Capital Cities Quiz", slug:"capitals-quiz", icon:"🌎", category:"brain", desc:"Test your geography knowledge."}
];

const gamesContainer = document.getElementById("games");
const searchInput = document.getElementById("search");
const gameCount = document.getElementById("gameCount");

let activeCategory = "all";

function renderGames() {
  const search = searchInput.value.toLowerCase();

  const filtered = games.filter(game => {
    const matchesSearch = game.name.toLowerCase().includes(search);
    const matchesCategory =
      activeCategory === "all" || game.category === activeCategory;
    return matchesSearch && matchesCategory;
  });

  gamesContainer.innerHTML = "";

  gameCount.textContent = filtered.length + " games found";

  filtered.forEach(game => {
    const card = document.createElement("div");
    card.className = "game";

    const picture = document.createElement("div");
    picture.className = "picture";
    picture.textContent = game.icon;

    const title = document.createElement("h2");
    title.textContent = game.name;

    const description = document.createElement("p");
    description.textContent = game.desc;

    const button = document.createElement("button");
    button.className = "play";
    button.textContent = "PLAY NOW";
    button.addEventListener("click", () => {
      openGame("https://playbolt.app/play/" + game.slug + "/");
    });

    card.append(picture, title, description, button);
    gamesContainer.appendChild(card);
  });
}

document.querySelectorAll(".categories button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".categories button").forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");
    activeCategory = button.dataset.category;
    renderGames();
  });
});

searchInput.addEventListener("input", renderGames);

const player = document.getElementById("player");
const gameFrame = document.getElementById("gameFrame");

function openGame(url) {
  gameFrame.src = url;
  player.classList.remove("hidden");

  if (player.requestFullscreen) {
    player.requestFullscreen().catch(() => {});
  }
}

function closeGame() {
  gameFrame.src = "";
  player.classList.add("hidden");

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && !player.classList.contains("hidden")) {
    gameFrame.src = "";
    player.classList.add("hidden");
  }
});

renderGames();
</script>

</body>
</html>
